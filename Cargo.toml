[workspace]
members = [
    "crates/forge-cli",
    "crates/forge-core",
    "crates/forge-media",
    "crates/forge-presets",
    "crates/forge-transcribe",
    "crates/forge-batch",
    "crates/forge-report",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jasperdevs/Forgy"
homepage = "https://github.com/jasperdevs/Forgy"
description = "A beautiful, fast, terminal-native media toolkit."

[workspace.dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
ctrlc = "3.5"
indicatif = "0.18"
owo-colors = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
